server:
  port: 8080
  address: 127.0.0.1
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 12s
          routes:
            - id: cliente
              uri: lb://cliente-service
              predicates:
                - Path=/api/clientes,/api/clientes/**
            - id: categoria
              uri: lb://categoria-service
              predicates:
                - Path=/api/categorias,/api/categorias/**
            - id: producto
              uri: lb://producto-service
              predicates:
                - Path=/api/productos,/api/productos/**
            - id: pedido
              uri: lb://pedido-service
              predicates:
                - Path=/api/pedidos,/api/pedidos/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
